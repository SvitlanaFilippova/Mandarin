activity = "1.11.0"
agp = "8.13.0"
composeBom = "2025.10.00"
navigation = "2.9.1"
coreKtx = "1.17.0"
detekt = "1.23.8"
firebaseCrashlytics = "3.0.4"
googleService = "4.4.3"
junit = "4.13.2"
junitVersion = "1.3.0"
