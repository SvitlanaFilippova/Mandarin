name: Build (Main)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  main_build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create google-services.json from secret
        run: |
          mkdir -p app/src/debug
          echo '${{ secrets.GOOGLE_SERVICES_JSON_RELEASE }}' > app/google-services.json
          echo '${{ secrets.GOOGLE_SERVICES_JSON_DEBUG }}' > app/src/debug/google-services.json

      - name: Create apikeys.properties from secrets
        run: |
          printf "MAPKIT_API_KEY=%s\nIIKO_API_KEY=%s\nTG_BOT_TOKEN=%s\nTG_CHANNEL_ID=%s\nDEV_TG_CHAT_ID=%s\n" \
            "$MAPKIT_API_KEY" "$IIKO_API_KEY" "$TG_BOT_TOKEN" "$TG_CHANNEL_ID" "$DEV_TG_CHAT_ID" \
            > apikeys.properties
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          MAPKIT_API_KEY: ${{ secrets.MAPKIT_API_KEY }}
          IIKO_API_KEY: ${{ secrets.IIKO_API_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
          DEV_TG_CHAT_ID: ${{ secrets.DEV_TG_CHAT_ID }}

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/

      - name: Run Detekt formatting
        run: ./gradlew detektFormat

      - name: Run DetektAll
        run: ./gradlew detektAll

      - name: Run Android Lint
        run: ./gradlew lintDebug

      - name: Upload Lint Report
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

      - name: Build (Release)
        run: ./gradlew build

      - name: Assemble Release APK
        run: ./gradlew assembleRelease

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-${{ github.run_number }}
          name: Release Build-${{ github.run_number }}
          files: app/build/outputs/apk/release/app-release.apk
          draft: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}