name: Build (Main)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  main_build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create google-services.json from secret
        run: |
          mkdir -p composeApp/src/androidMain
          echo '${{ secrets.GOOGLE_SERVICES_JSON_RELEASE }}' > composeApp/google-services.json
          echo '${{ secrets.GOOGLE_SERVICES_JSON_DEBUG }}' > composeApp/src/androidMain/google-services.json

      - name: Create apikeys.properties from secrets
        run: |
          printf "MAPKIT_API_KEY=%s\nIIKO_API_KEY=%s\nTG_BOT_TOKEN=%s\nTG_CHANNEL_ID=%s\nDEV_TG_CHAT_ID=%s\nSERVER_BASE_URL=%s\nMANDARIN_API_KEY=%s\n" \
            "$MAPKIT_API_KEY" "$IIKO_API_KEY" "$TG_BOT_TOKEN" "$TG_CHANNEL_ID" "$DEV_TG_CHAT_ID" "$SERVER_BASE_URL" "$MANDARIN_API_KEY" \
            > apikeys.properties
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          MAPKIT_API_KEY: ${{ secrets.MAPKIT_API_KEY }}
          IIKO_API_KEY: ${{ secrets.IIKO_API_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
          DEV_TG_CHAT_ID: ${{ secrets.DEV_TG_CHAT_ID }}
          SERVER_BASE_URL: ${{ secrets.SERVER_BASE_URL }}
          MANDARIN_API_KEY: ${{ secrets.MANDARIN_API_KEY }}

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      - name: Verify keystore
        run: ls -l release.keystore

      - name: Assemble Release APK
        run: |
          ./gradlew :composeApp:assembleRelease \
          -Pandroid.injected.signing.store.file=$PWD/release.keystore \
          -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
          -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
          -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}" \
          --stacktrace


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: composeApp/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-${{ github.run_number }}
          name: Release Build-${{ github.run_number }}
          files: composeApp/build/outputs/apk/release/*.apk
          draft: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
